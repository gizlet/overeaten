# Overeaten's Gizlet app manifest. scripts/package.sh copies it to the root
# of the app folder, so the paths below are relative to that folder. Keep
# version in step with Cargo.toml.
id = "io.gizlet.overeaten"
version = "0.1.0"
name = "Overeaten"
kind = "game"
runtime = 1
arch = "aarch64"
exec = "bin/overeaten"
icon = "icon.png"

[names]
zh-CN = "吃吃吃"
