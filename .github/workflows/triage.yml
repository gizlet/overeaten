name: PR triage

# The only entry point for pull-request Codex review. A `/codex-review` comment
# line from a user with write access dispatches codex-review.yml on main for
# the pull request's current head; nothing runs on push. Runs on a
# GitHub-hosted runner and never checks out pull-request code.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  triage:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/')
    permissions:
      actions: write
      contents: read
      pull-requests: write
    uses: gizlet/.github/.github/workflows/pr-triage.yml@latest
    with:
      commands: |
        /codex-review=codex-review.yml
