name: Codex review

# Reviews the pull-request diff with Codex and reports the `Codex Code Review`
# check. triage.yml dispatches it when a user with write access comments
# `/codex-review`. Runs on GitHub-hosted runners and never
# executes pull-request code. See https://github.com/gizlet/.github.

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Open pull request to review.
        required: true
        type: string
      head_sha:
        description: Expected pull-request head, set by triage.
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  review:
    concurrency:
      group: codex-review-${{ inputs.pull_request_number }}
      cancel-in-progress: false
    permissions:
      checks: write
      contents: read
      issues: write
      pull-requests: write
    uses: gizlet/.github/.github/workflows/codex-review.yml@latest
    with:
      pull_request_number: ${{ inputs.pull_request_number }}
      head_sha: ${{ inputs.head_sha }}
      review-instructions: >-
        Overeaten is a game for Gizlet handhelds. Focus on gameplay logic
        correctness, input handling, performance on low-end ARM hardware, and asset
        or save-data regressions. Images, sounds and the font are Git LFS files
        (.gitattributes covers *.png, *.jpg, *.wav and *.otf), so the diff shows
        only their pointers; that is expected and not a finding. Check that code
        refers to asset paths that exist, not the binary contents.
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
