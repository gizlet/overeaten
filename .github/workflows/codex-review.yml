name: Codex review

# Reviews the pull-request diff with Codex and reports the `Codex Code Review`
# check. It runs for a comment with a `/codex-review` line, posted by gizlet-bot
# when the pull request is opened or updated, or by a writer to review again.
# Runs on GitHub-hosted runners and never executes pull-request code.
# See https://github.com/gizlet/.github.

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Open pull request to review.
        required: false
        default: ''
        type: string
      head_sha:
        description: Expected pull-request head; a moved head is skipped.
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  review:
    # Every new comment starts this workflow; only one with a /codex-review line goes on.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.pull_request_number != '')
      || (github.event_name == 'issue_comment' && github.event.issue.pull_request
          && contains(github.event.comment.body, '/codex-review'))
    concurrency:
      group: codex-review-${{ inputs.pull_request_number || github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      checks: write
      contents: read
      issues: write
      pull-requests: write
    uses: gizlet/.github/.github/workflows/codex-review.yml@latest
    with:
      pull_request_number: ${{ inputs.pull_request_number }}
      head_sha: ${{ inputs.head_sha }}
      review-instructions: >-
        Overeaten is a game for Gizlet handhelds. Focus on gameplay logic
        correctness, input handling, performance on low-end ARM hardware, and asset
        or save-data regressions. Most images, sounds and the font use Git LFS.
        The Store icon is a regular Git file. Check that referenced asset paths
        exist.
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
